# Quality gate — Part 7 Exercise 7.3
# Chạy eval trên golden dataset cho mỗi pull request. run_eval.py trả exit code 1 khi
# accuracy < --min-accuracy hoặc có câu bị regression so với baseline → job fail → PR
# không merge được (bật "Require status checks to pass" cho branch main).
name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8000 python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          cat agent.log; exit 1

      - name: Eval + quality gate (accuracy 100%, no regression)
        run: |
          python eval/run_eval.py --url http://localhost:8000 \
            --min-accuracy 1.0 \
            --baseline reports/eval_v2_fixed.json \
            --out eval_ci.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            06-lab-complete/benchmark-observability/develop/eval_ci.json
            06-lab-complete/benchmark-observability/develop/agent.log
