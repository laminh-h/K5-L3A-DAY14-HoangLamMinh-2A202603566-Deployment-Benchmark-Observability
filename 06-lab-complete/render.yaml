# Render Blueprint (https://render.com/docs/blueprint-spec)
# Render đọc render.yaml ở gốc repo; agent nằm trong 06-lab-complete/ nên dùng rootDir.
services:
  - type: web
    name: production-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh key ngẫu nhiên, không ghi trong repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString

  - type: keyvalue
    name: agent-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction      # không để Redis tự xoá key rate limit / cost
    ipAllowList: []                  # chỉ cho service trong cùng tài khoản Render truy cập
